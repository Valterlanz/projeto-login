<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-queries.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <main>
        <section id="login">
            <div id="foto">
            
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo novamente. Faça seu login para acessar sua conta.</p>
                <form action="Cadastro" method="get" autocomplete="on">
                        <div class="campo">
                            <span class="material-symbols-outlined">person</span>
                            <label for="email"></label>
                            <input type="email" name="email" id="umemail" required placeholder="Digite seu Email" autocomplete="email" maxlength="30">
                        </div>

                        <div class="campo">
                            <span class="material-symbols-outlined">lock</span>
                            <label for="senha"></label>
                            <input type="password" name="password" id="umasenha" required placeholder="Digite sua Senha" autocomplete="current-password" maxlength="20" minlength="8">
                        </div>
                    
                        <input type="submit" value="Entrar">
                        <a href="Esqueci.html" class="botao">Esqueci a Senha<span class="material-symbols-outlined">encrypted</span></a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
